<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sombra sutil para despegar del fondo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Casa posterior (Gris Titanio / Hormigón) -->
  <path d="M22 6 L44 24 L44 54 L22 54 L14 54 L14 26 Z" fill="#64748B" filter="url(#shadow)" />
  
  <!-- Ventana técnica edificio trasero -->
  <rect x="18" y="30" width="6" height="6" fill="#0F172A" rx="1" />

  <!-- Casa frontal (Burdeo / Rojo Corporativo Quinteros & Tapia) -->
  <path d="M30 18 L54 36 L54 58 L24 58 L24 34 Z" fill="#9C1930" filter="url(#shadow)" />
  
  <!-- Vano / Puerta casa frontal -->
  <rect x="34" y="40" width="8" height="18" fill="#F8FAFC" rx="1" opacity="0.9" />
  <!-- Ventana secundaria -->
  <rect x="44" y="40" width="6" height="6" fill="#F8FAFC" rx="1" opacity="0.9" />

  <!-- Base sólida de cimiento -->
  <rect x="8" y="58" width="50" height="3" fill="#334155" rx="1.5" />
</svg>
